name: CI

on:
  push:
    branches: [main, develop, 'feat/**', 'fix/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run gitleaks
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --source /repo --config /repo/.gitleaks.toml --no-git --verbose

  lint-and-test:
    name: Lint, Type Check and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Format check
        run: uv run ruff format --check src/

      - name: Lint
        run: uv run ruff check src/

      - name: Type check
        run: uv run mypy src/

      - name: Test
        run: uv run pytest tests/ -v

  docker-smoke:
    name: Docker build smoke (cron image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build axis-ai-cron image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cron
          load: true
          tags: axis-ai-cron:ci-smoke
          platforms: linux/amd64
          push: false

      - name: Verify cron imports
        run: |
          docker run --rm axis-ai-cron:ci-smoke \
            python -c "from src.evaluators.llm_judge_prompts import JUDGE_MODEL; print(JUDGE_MODEL)"
          docker run --rm axis-ai-cron:ci-smoke \
            python -m scripts.postprocess_singleton_clusters --help
