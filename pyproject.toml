[project]
name = "axis-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.134,<0.137",
    "starlette>=1.0.1",
    "uvicorn[standard]>=0.27",
    "langchain>=0.2",
    "langchain-core>=0.2",
    "langchain-openai>=0.1",
    "langgraph>=0.1",
    "FlagEmbedding>=1.2",
    # torch 는 FlagEmbedding 전이 의존성이지만 CPU 인덱스 핀([tool.uv.sources]) 적용을
    # 위해 직접 의존성으로 선언 (uv sources 는 직접 의존성에만 적용됨).
    "torch>=2.0",
    "qdrant-client==1.17.1",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "openai>=1.30",
    "apscheduler>=3.10",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "playwright>=1.44",
    "readability-lxml>=0.8",
    "websockets>=12.0",
    # Sprint 2: "scikit-learn>=1.4", "telethon>=1.36"
    "transformers>=4.44,<5.0",
    "pymupdf>=1.27.2.3",
    "matplotlib>=3.10.9",
    "finance-datareader>=0.9.96",
    "pandas>=2.0",
    "langfuse>=3,<5",
    "tiktoken>=0.7",
]

[dependency-groups]
# Dockerfile.cron (axis-ai-cron) — card-evaluator 전용. torch/Playwright 미포함.
cron = [
    "langchain-core>=0.2",
    "langchain-openai>=0.1",
    "openai>=1.30",
    "psycopg2-binary>=2.9",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "tiktoken>=0.7",
]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pre-commit>=3.0",
    "types-requests>=2.33.0.20260503",
    "types-python-dateutil>=2.9.0.20260408",
    "import-linter>=2.11",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.11"
strict_optional = true
ignore_missing_imports = true
exclude = [
    "src/agents/_deprecated/",  # v3에서 보관 처리된 v1 에이전트 — 운영 경로 아님
    "src/crawler/local/",       # 로컬 단독 실행용 크롤러 — 운영 import 경로 아님
]

[[tool.mypy.overrides]]
module = [
    "src.crawler.sources.*",
    "src.crawler.parsers.*",
]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

# GPU 없는 노드(m4.xlarge)에서 CUDA 동봉 torch 휠(~2GB)을 받지 않도록 CPU 전용 인덱스 고정.
# 효과: axis-ai 이미지 대폭 슬림 → 빌드/푸시/풀(매일 아침 노드 재생성) 전부 단축.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# ── import-linter — 모듈 경계 가드 (PROJECT_STRUCTURE_PLAN Phase 2-A1) ──
# agents → api 방향 의존이 순환(api ↔ agents)을 만든다. 기존 위반 2건은
# allowlist 로 두고 신규 유입만 차단. 스키마가 필요하면 src/api 가 아니라
# 중립 모듈(향후 src/contracts)로 옮길 것.
[tool.importlinter]
root_packages = ["src"]

[[tool.importlinter.contracts]]
name = "agents must not import api"
type = "forbidden"
source_modules = ["src.agents"]
forbidden_modules = ["src.api"]
ignore_imports = []

[[tool.importlinter.contracts]]
name = "contracts is a leaf layer (no api/agents/services/pipeline imports)"
type = "forbidden"
source_modules = ["src.contracts"]
forbidden_modules = ["src.api", "src.agents", "src.services", "src.pipeline", "src.db"]

[[tool.importlinter.contracts]]
name = "llm is a leaf layer (no axis-internal upward imports)"
type = "forbidden"
source_modules = ["src.llm"]
forbidden_modules = ["src.api", "src.agents", "src.services", "src.pipeline", "src.db", "src.preprocessing", "src.analysis", "src.composers", "src.extractors", "src.crawler", "src.rag"]

[[tool.importlinter.contracts]]
name = "shared is a leaf layer (no axis-internal upward imports)"
type = "forbidden"
source_modules = ["src.shared"]
forbidden_modules = ["src.api", "src.agents", "src.services", "src.pipeline", "src.db", "src.preprocessing", "src.analysis", "src.composers", "src.extractors", "src.crawler", "src.rag", "src.llm"]
