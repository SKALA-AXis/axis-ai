[project]
name = "axis-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.27",
    "langchain>=0.2",
    "langchain-core>=0.2",
    "langchain-openai>=0.1",
    "langgraph>=0.1",
    "FlagEmbedding>=1.2",
    "qdrant-client>=1.9",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "openai>=1.30",
    "apscheduler>=3.10",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "playwright>=1.44",
    "readability-lxml>=0.8",
    "websockets>=12.0",
    # Sprint 2: "scikit-learn>=1.4", "telethon>=1.36"
    "transformers>=4.44,<5.0",
    "pymupdf>=1.27.2.3",
    "matplotlib>=3.10.9",
]

[dependency-groups]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pre-commit>=3.0",
    "types-requests>=2.33.0.20260503",
    "types-python-dateutil>=2.9.0.20260408",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.11"
strict_optional = true
ignore_missing_imports = true
exclude = [
    "src/agents/_deprecated/",  # v3에서 보관 처리된 v1 에이전트 — 운영 경로 아님
    "src/crawler/local/",       # 로컬 단독 실행용 크롤러 — 운영 import 경로 아님
]

[[tool.mypy.overrides]]
module = [
    "src.crawler.sources.*",
    "src.crawler.parsers.*",
]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
